# Encaminha os alertas para um webhook. Localmente o "notificador" apenas registra o
# que recebeu (docker compose logs notificador), servindo de evidência do disparo.
# Para receber no Discord/Slack/Teams, troque a url por um webhook real guardado fora do git.
route:
  receiver: notificador
  group_by: ["alertname", "job"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: notificador
    webhook_configs:
      - url: http://notificador:8080/alerta
        send_resolved: true
