# Prometheus da SeguWatts.
# - seguwatts-local:    o container do docker compose (app:8000)
# - seguwatts-producao: o MVP publicado no Azure, lido por HTTPS com token Bearer.
#   Crie targets/producao.json a partir de producao.json.example e o arquivo metrics_token
#   (o mesmo valor do secret METRICS_TOKEN). Os dois ficam fora do git.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: seguwatts-local
    static_configs:
      - targets: ["app:8000"]
        labels:
          ambiente: local

  - job_name: seguwatts-producao
    # 60 s para não gastar a cota de CPU do plano F1 (60 min/dia).
    scrape_interval: 60s
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 1m
